

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Patient Outcomes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }
        h1 { color: #176b5b; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button {
            margin-top: 25px;
            padding: 12px;
            width: 100%;
            background: #176b5b;
            color: white;
            border: none;
            cursor: pointer;
        }
        .note { color: #555; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Patient Outcome Prediction</h1>
    <p>Enter the required information below.</p>

```
<form action="/result" method="POST">

    <label>Age</label>
    <input type="number" name="age" min="0" max="120" required>

    <label>CD4 Count</label>
    <input type="number" name="cd4" min="0" required>

    <label>Viral Load (copies/mL)</label>
    <input type="number" name="viral_load" min="0" required>

    <label>Gender</label>
    <select name="gender" required>
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label>Sub-county</label>
    <select name="subcounty" required>
        <option value="">Select sub-county</option>
        <option value="Ainabkoi">Ainabkoi</option>
        <option value="Eldoret">Eldoret</option>
        <option value="Kapseret">Kapseret</option>
        <option value="Kesses">Kesses</option>
        <option value="Moiben">Moiben</option>
        <option value="Soy">Soy</option>
        <option value="Turbo">Turbo</option>
    </select>

    <label>Entry Point</label>
    <input type="text" name="entrypoint" required>

    <label>ART Status</label>
    <input type="text" name="artstatus" required>

    <label>Regimen Line</label>
    <input type="text" name="regimen" required>

    <label>WHO Stage</label>
    <input type="text" name="whostage" required>

    <label>Adherence Level</label>
    <select name="adherence" required>
        <option value="">Select adherence level</option>
        <option value="Good">Good</option>
        <option value="Fair">Fair</option>
        <option value="Poor">Poor</option>
    </select>

    <label>Clinic Visits in the Last 12 Months</label>
    <input type="number" name="visits" min="0" required>

    <label>Insurance Cover</label>
    <input type="text" name="insurance" required>

    <button type="submit">Generate Predictions</button>
</form>

<p class="note">
    Predictions are generated by machine learning models and are
    not a substitute for professional clinical assessment.
</p>

<a href="/">Return to Home</a>
```

</div>
</body>
</html>
